name: aifpatent-rag

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg17-bookworm
    environment:
      POSTGRES_DB: ${AIFPATENT_POSTGRES_DB}
      POSTGRES_USER: ${AIFPATENT_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AIFPATENT_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${AIFPATENT_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8.4.4-alpine
    environment:
      AIFPATENT_REDIS_PASSWORD: ${AIFPATENT_REDIS_PASSWORD}
    command:
      - /bin/sh
      - -ec
      - exec redis-server --appendonly yes --requirepass "$$AIFPATENT_REDIS_PASSWORD"
    ports:
      - "127.0.0.1:${AIFPATENT_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a $$AIFPATENT_REDIS_PASSWORD ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  object-store:
    build:
      context: ../..
      dockerfile: deploy/rag/Dockerfile.minio
      args:
        MINIO_VERSION: ${AIFPATENT_MINIO_VERSION:-RELEASE.2025-10-15T17-29-55Z}
        GOPROXY: ${AIFPATENT_GOPROXY:-https://proxy.golang.org,direct}
    environment:
      MINIO_ROOT_USER: ${AIFPATENT_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${AIFPATENT_MINIO_ROOT_PASSWORD}
    command: server --console-address ":9001" /data
    ports:
      - "127.0.0.1:${AIFPATENT_MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${AIFPATENT_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - object-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  object-data:

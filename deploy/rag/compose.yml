name: aifpatent-rag

services:
  app:
    user: "0:0"
    entrypoint: ["/usr/local/bin/aifpatent-entrypoint"]
    command: ["python", "-m", "uvicorn", "main:app", "--app-dir", "/app/backend", "--host", "0.0.0.0", "--port", "8001", "--workers", "1"]
    build:
      context: ../..
      dockerfile: deploy/app/Dockerfile
      args:
        PIP_INDEX_URL: ${AIFPATENT_PIP_INDEX_URL:-https://pypi.org/simple}
    environment:
      AI4PATENT_CONFIG: /app/config/ai4patent.json
      AIFPATENT_POSTGRES_DSN: postgresql://${AIFPATENT_POSTGRES_USER}:${AIFPATENT_POSTGRES_PASSWORD}@postgres:5432/${AIFPATENT_POSTGRES_DB}
      AIFPATENT_S3_ENDPOINT_URL: http://object-store:9000
      AIFPATENT_S3_BUCKET: ${AIFPATENT_S3_BUCKET:-aifpatent-corpus}
      AIFPATENT_S3_ACCESS_KEY: ${AIFPATENT_MINIO_ROOT_USER}
      AIFPATENT_S3_SECRET_KEY: ${AIFPATENT_MINIO_ROOT_PASSWORD}
      AIFPATENT_S3_REGION: ${AIFPATENT_S3_REGION:-us-east-1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      AIFPATENT_EMBEDDING_ENABLED: ${AIFPATENT_EMBEDDING_ENABLED:-}
      AIFPATENT_EMBEDDING_PROVIDER: ${AIFPATENT_EMBEDDING_PROVIDER:-}
      AIFPATENT_EMBEDDING_MODEL: ${AIFPATENT_EMBEDDING_MODEL:-}
      AIFPATENT_EMBEDDING_BASE_URL: ${AIFPATENT_EMBEDDING_BASE_URL:-}
      AIFPATENT_EMBEDDING_DIMENSIONS: ${AIFPATENT_EMBEDDING_DIMENSIONS:-}
      AIFPATENT_PROVIDER_CREDENTIALS_SOURCE: /run/secrets/provider-credentials.json
      AIFPATENT_PROVIDER_CREDENTIALS: /run/aifpatent/provider-credentials.json
    ports:
      - "127.0.0.1:${AIFPATENT_APP_PORT:-8001}:8001"
    volumes:
      - app-data:/app/data
      - app-workspace:/app/workspace
      - app-logs:/app/logs
    secrets:
      - source: provider-credentials
        target: provider-credentials.json
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-store:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/openapi.json', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6

  postgres:
    image: pgvector/pgvector:0.8.2-pg17-bookworm
    environment:
      POSTGRES_DB: ${AIFPATENT_POSTGRES_DB}
      POSTGRES_USER: ${AIFPATENT_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AIFPATENT_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${AIFPATENT_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8.4.4-alpine
    environment:
      AIFPATENT_REDIS_PASSWORD: ${AIFPATENT_REDIS_PASSWORD}
    command:
      - /bin/sh
      - -ec
      - exec redis-server --appendonly yes --requirepass "$$AIFPATENT_REDIS_PASSWORD"
    ports:
      - "127.0.0.1:${AIFPATENT_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a $$AIFPATENT_REDIS_PASSWORD ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  object-store:
    build:
      context: ../..
      dockerfile: deploy/rag/Dockerfile.minio
      args:
        MINIO_VERSION: ${AIFPATENT_MINIO_VERSION:-RELEASE.2025-10-15T17-29-55Z}
        GOPROXY: ${AIFPATENT_GOPROXY:-https://proxy.golang.org,direct}
    environment:
      MINIO_ROOT_USER: ${AIFPATENT_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${AIFPATENT_MINIO_ROOT_PASSWORD}
    command: server --console-address ":9001" /data
    ports:
      - "127.0.0.1:${AIFPATENT_MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${AIFPATENT_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - object-data:/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/minio", "--version"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  app-data:
  app-workspace:
  app-logs:
  postgres-data:
  redis-data:
  object-data:

secrets:
  provider-credentials:
    file: ../../config/provider-credentials.local.json
